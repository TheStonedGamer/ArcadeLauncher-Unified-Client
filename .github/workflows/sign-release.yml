name: Sign release artifacts

# Signs desktop bundles that were built outside CI (for example the local Docker
# cross-build used while the self-hosted runners are off), then writes the Tauri
# `latest.json` for them. The bundles must already be uploaded, unsigned, to a
# DRAFT release. This runs on a GitHub-hosted runner so the updater key never
# leaves the repo secrets. It also builds the qbsdiff delta patches against the
# installers currently on the download server, plus latest.server.json (the
# manifest the download server serves). Copying those onto the server is done
# from the LAN.
#
#   gh workflow run sign-release.yml -f release_id=<id> -f version=0.15.34

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release id (gh api repos/{owner}/{repo}/releases)
        required: true
      version:
        description: Version the bundles were built as (no leading v)
        required: true

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ inputs.release_id }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download unsigned bundles from the draft
        run: |
          mkdir -p bundles && cd bundles
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name | test("(-setup\\.exe|\\.deb|\\.rpm|\\.AppImage)$")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$name"
          done
          ls -l

      - name: Sign each bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd bundles
          for f in *-setup.exe *.deb *.rpm *.AppImage; do
            npx -y @tauri-apps/cli@2 signer sign "$f"
          done
          ls -l *.sig

      - name: Write latest.json
        run: |
          cd bundles
          node <<'NODE'
          const fs = require('fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const base = `https://github.com/${repo}/releases/latest/download`;
          const find = suffix => fs.readdirSync('.').find(f => f.endsWith(suffix));
          const entry = file => ({
            signature: fs.readFileSync(`${file}.sig`, 'utf8').trim(),
            url: `${base}/${encodeURIComponent(file)}`,
          });
          const exe = find('-setup.exe'), app = find('.AppImage'), deb = find('.deb'), rpm = find('.rpm');
          for (const [n, f] of Object.entries({ exe, app, deb, rpm })) {
            if (!f) throw new Error(`missing ${n} bundle`);
          }
          const manifest = {
            version: process.env.VERSION,
            notes: '',
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': entry(exe),
              'windows-x86_64-nsis': entry(exe),
              'linux-x86_64': entry(app),
              'linux-x86_64-appimage': entry(app),
              'linux-x86_64-deb': entry(deb),
              'linux-x86_64-rpm': entry(rpm),
            },
          };
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          NODE
          cat latest.json

      # Same delta logic as release.yml's stage-downloads, but the previous
      # installers come from the public download origin instead of over SSH.
      # Produces the qbsdiff patches plus latest.server.json: the manifest the
      # download server serves as latest.json (payload URLs on the download
      # origin, plus `deltas`). Staging onto the server is done from the LAN.
      - name: Build delta patches and the download-server manifest
        run: |
          cd bundles
          cargo install qbsdiff --version 1.4.4 --features cmd
          mkdir -p ../previous
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const origin = 'https://arcade.orlandoaio.net/downloads';
          const served = JSON.parse(execFileSync('curl', ['-fsS', `${origin}/latest.json`]).toString());
          for (const key of ['windows-x86_64-nsis', 'linux-x86_64-appimage']) {
            const url = served.platforms?.[key]?.url;
            if (!url) continue;
            const name = decodeURIComponent(new URL(url).pathname.split('/').pop());
            execFileSync('curl', ['-fsSL', '-o', `../previous/${name}`, `${origin}/${encodeURIComponent(name)}`]);
            console.log(`previous ${key}: ${name}`);
          }
          NODE
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const baseUrl = 'https://arcade.orlandoaio.net/downloads';
          const manifest = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          manifest.deltas = {};
          for (const entry of Object.values(manifest.platforms)) {
            const filename = decodeURIComponent(new URL(entry.url).pathname.split('/').pop());
            entry.url = `${baseUrl}/${filename}`;
          }
          const files = dir => fs.existsSync(dir) ? fs.readdirSync(dir) : [];
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          for (const spec of [
            { key: 'windows-x86_64-nsis', suffix: '-setup.exe' },
            { key: 'linux-x86_64-appimage', suffix: '.AppImage' },
          ]) {
            const currentName = files('.').find(n => n.endsWith(spec.suffix));
            const previousName = files('../previous').find(n => n.endsWith(spec.suffix));
            if (!currentName || !previousName || currentName === previousName) continue;
            const previous = path.join('../previous', previousName);
            const from = (previousName.match(/(\d+\.\d+\.\d+)/) || [])[1];
            if (!from) continue;
            const patchName = `ArcadeLauncher_${from}_to_${manifest.version}_${spec.key}.patch`;
            execFileSync('qbsdiff', [previous, currentName, patchName], { stdio: 'inherit' });
            const patchSize = fs.statSync(patchName).size;
            const fullSize = fs.statSync(currentName).size;
            if (patchSize >= fullSize * 0.85) {
              fs.rmSync(patchName);
              console.log(`Skipping inefficient ${spec.key} delta (${patchSize}/${fullSize})`);
              continue;
            }
            manifest.deltas[spec.key] = {
              from,
              url: `${baseUrl}/${patchName}`,
              baseSha256: sha256(previous),
              size: patchSize,
            };
            console.log(`Built ${spec.key} delta ${from} -> ${manifest.version}: ${patchSize} bytes`);
          }
          fs.writeFileSync('latest.server.json', JSON.stringify(manifest, null, 2));
          NODE
          cat latest.server.json

      - name: Upload signatures and latest.json to the draft
        # By release id: "get release by tag" (what `gh release upload` uses)
        # never returns drafts.
        run: |
          cd bundles
          for f in *.sig *.patch latest.json latest.server.json; do
            [ -e "$f" ] || continue
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$f\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$f" >/dev/null
            echo "uploaded $f"
          done
